<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitro - إيقاف مؤقت</title>

<!-- استيراد الخط العربي الجديد من Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    /* تم استبدال Segoe UI بالخط العربي الجديد */
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0d0d12;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(120, 60, 255, 0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255, 60, 120, 0.12), transparent 40%);
    color: #eaeaea;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .card {
    max-width: 620px;
    width: 100%;
    background: rgba(20, 20, 28, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
    animation: cardIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(122, 61, 255, 0.10) 90deg,
      transparent 180deg,
      rgba(255, 61, 120, 0.10) 270deg,
      transparent 360deg
    );
    animation: spinGlow 12s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  .card > * { position: relative; z-index: 1; }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #7a3dff, #ff3d78);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
    animation: fadeUp 0.8s ease 0.2s both, pulseBadge 2.4s ease-in-out 1.2s infinite;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 20px;
    color: #ffffff;
    line-height: 1.5;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  .line {
    font-size: 16px;
    line-height: 1.9;
    color: #c9c9d4;
    margin-bottom: 14px;
    animation: fadeUp 0.8s ease both;
  }

  .line:nth-of-type(1) { animation-delay: 0.5s; }
  .line:nth-of-type(2) { animation-delay: 0.65s; }
  .line:nth-of-type(3) { animation-delay: 0.8s; }

  .highlight {
    color: #b48cff;
    font-weight: 600;
    display: inline-block;
    animation: glowText 2.6s ease-in-out infinite;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    margin: 25px 0;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s ease 0.55s both;
  }

  .divider::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(180, 140, 255, 0.9), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }

  .footer-note {
    font-size: 15px;
    color: #9a9aa8;
    line-height: 1.8;
    animation: fadeUp 0.8s ease 1s both;
  }

  .footer-note strong {
    color: #ffffff;
    animation: glowText 2.6s ease-in-out infinite;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spinGlow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes pulseBadge {
    0%, 100% { box-shadow: 0 0 0 0 rgba(122, 61, 255, 0.45); }
    50%      { box-shadow: 0 0 0 10px rgba(122, 61, 255, 0); }
  }

  @keyframes glowText {
    0%, 100% { text-shadow: 0 0 0 rgba(180, 140, 255, 0); }
    50%      { text-shadow: 0 0 12px rgba(180, 140, 255, 0.65); }
  }

  @keyframes shimmer {
    0%   { left: -40%; }
    60%  { left: 100%; }
    100% { left: 100%; }
  }

  @media (max-width: 480px) {
    .card { padding: 35px 22px; }
    h1 { font-size: 21px; }
    .line { font-size: 14.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">إعلان هام من Nitro</div>

    <h1>سيتم إيقاف موقع Nitro مؤقتًا</h1>

    <p class="line">
      لإجراء تحديث مهم استعدادًا لوصول <span class="highlight">Speed Lite 2.0</span>
    </p>

    <div class="divider"></div>

    <p class="line">
      نعمل على تجهيز الإصدار الجديد، والرحلة القادمة ستكون مختلفة
    </p>

    <p class="line">
      ترقّبوا الجديد… القادم يستحق الانتظار
    </p>

    <div class="divider"></div>

    <p class="footer-note">
      شكرًا لدعمكم وثقتكم بنا <strong>Nitro</strong>
    </p>
  </div>
</body>
</html>
