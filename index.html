<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nitro - صيانة مؤقتة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/cairo@latest/index.css">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1: #07070b;
    --bg-2: #0f0f18;
    --accent-a: #4f8cff;
    --accent-b: #8b5cf6;
    --accent-c: #22d3ee;
    --text: #e8e8f0;
    --text-dim: #9a9ab0;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* شبكة خفيفة في الخلفية */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    pointer-events: none;
    animation: gridDrift 30s linear infinite;
  }

  /* هالتان ضوئيتان تتنفسان */
  body::after {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(circle at 25% 30%, rgba(79, 140, 255, 0.14), transparent 45%),
      radial-gradient(circle at 75% 70%, rgba(139, 92, 246, 0.14), transparent 45%);
    animation: breathe 8s ease-in-out infinite;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 640px;
    width: 100%;
  }

  /* ===== الأيقونة العلوية: حلقة متحركة ===== */
  .halo {
    width: 96px;
    height: 96px;
    margin: 0 auto 32px;
    position: relative;
    animation: haloIn 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  .halo .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    background: conic-gradient(from 0deg,
      transparent 0%,
      var(--accent-a) 25%,
      var(--accent-c) 50%,
      var(--accent-b) 75%,
      transparent 100%) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: spin 3.5s linear infinite;
  }

  .halo .ring:nth-child(2) {
    inset: 12px;
    animation: spin 5s linear infinite reverse;
    opacity: 0.6;
  }

  .halo .core {
    position: absolute;
    inset: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), var(--accent-c) 40%, var(--accent-a) 75%, var(--accent-b) 100%);
    box-shadow:
      0 0 24px rgba(79, 140, 255, 0.55),
      0 0 48px rgba(139, 92, 246, 0.35);
    animation: pulseCore 2.4s ease-in-out infinite;
  }

  /* ===== النص ===== */
  .eyebrow {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-c);
    margin-bottom: 14px;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.45;
    margin-bottom: 16px;
    color: #fff;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  h1 span {
    background: linear-gradient(90deg, var(--accent-a), var(--accent-c), var(--accent-b));
    background-size: 200% 100%;
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientShift 4s ease infinite;
  }

  .lede {
    text-align: center;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.9;
    color: var(--text-dim);
    max-width: 480px;
    margin: 0 auto 30px;
    animation: fadeUp 0.8s ease 0.5s both;
  }

  /* ===== مؤشر حالة ===== */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 34px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    animation: fadeUp 0.8s ease 0.65s both;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent-c);
    box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7);
    animation: ping 1.6s ease-out infinite;
  }

  /* ===== بطاقات معلومات ===== */
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    animation: fadeUp 0.8s ease 0.8s both;
  }

  .fact {
    background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
    transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), border-color 0.35s;
  }

  .fact:hover {
    transform: translateY(-3px);
    border-color: rgba(79, 140, 255, 0.35);
  }

  .fact .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .fact .value {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    line-height: 1.5;
  }

  /* ===== شريط تقدم متحرك ===== */
  .bar {
    margin-top: 30px;
    height: 4px;
    width: 100%;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
    position: relative;
    animation: fadeUp 0.8s ease 1s both;
  }

  .bar::after {
    content: "";
    position: absolute;
    top: 0; left: -40%;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, transparent, var(--accent-c), var(--accent-a), transparent);
    animation: slide 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }

  /* ===== التذييل ===== */
  .sign {
    text-align: center;
    margin-top: 28px;
    font-size: 13.5px;
    color: var(--text-dim);
    animation: fadeUp 0.8s ease 1.15s both;
  }

  .sign strong {
    color: #fff;
    font-weight: 700;
  }

  /* ===== Keyframes ===== */
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes haloIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulseCore {
    0%, 100% { transform: scale(1); box-shadow: 0 0 24px rgba(79,140,255,0.55), 0 0 48px rgba(139,92,246,0.35); }
    50%      { transform: scale(1.06); box-shadow: 0 0 34px rgba(79,140,255,0.8), 0 0 64px rgba(139,92,246,0.55); }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.6); }
    100% { box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
  }
  @keyframes slide { 0% { left: -40%; } 60% { left: 100%; } 100% { left: 100%; } }
  @keyframes gridDrift { to { background-position: 48px 48px; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .lede { font-size: 14.5px; }
    .halo { width: 78px; height: 78px; margin-bottom: 26px; }
    .facts { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="halo">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="core"></div>
    </div>

    <div class="eyebrow">Nitro · Maintenance</div>

    <h1>الموقع تحت <span>الصيانة</span> حاليًا</h1>

    <p class="lede">
      نعمل حاليًا على إصلاح بعض الأخطاء وإجراء تحسينات ضرورية لضمان أفضل تجربة لكم. سنعود قريبًا إن شاء الله.
    </p>

    <div class="status">
      <span class="dot"></span>
      <span>الفريق يعمل على الإصلاحات الآن</span>
    </div>

    <div class="facts">
      <div class="fact">
        <div class="label">الحالة</div>
        <div class="value">قيد الإصلاح</div>
      </div>
      <div class="fact">
        <div class="label">الجاهزية</div>
        <div class="value">قريبًا</div>
      </div>
    </div>

    <div class="bar"></div>

    <div class="sign">
      شكرًا لتفهّمكم وصبركم <strong>Nitro</strong>
    </div>

  </div>
</body>
</html>
