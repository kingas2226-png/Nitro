<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الموقع متوقف مؤقتاً</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
    }

    .box {
      text-align: center;
      max-width: 500px;
      padding: 40px 25px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #22223b;
      animation: pop 0.25s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* نقاط تحميل سريعة */
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }

    .dots span {
      width: 10px;
      height: 10px;
      background: #4a9eff;
      border-radius: 50%;
      animation: blink 0.6s infinite alternate;
    }

    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      font-weight: 600;
    }

    p {
      font-size: 1rem;
      color: #b8b8d1;
      line-height: 1.7;
    }

    .line {
      width: 60px;
      height: 3px;
      background: #4a9eff;
      margin: 18px auto;
      border-radius: 2px;
      animation: grow 0.4s ease-out;
    }

    @keyframes grow {
      from { width: 0; }
      to   { width: 60px; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.3rem; }
      p { font-size: 0.9rem; }
      .box { padding: 30px 18px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <h1>الموقع متوقف مؤقتاً</h1>
    <div class="line"></div>
    <p>
      نقوم حالياً بإجراء إصلاحات على الموقع، وسنعود قريباً.
      نعتذر عن الإزعاج.
    </p>
  </div>
</body>
</html>
